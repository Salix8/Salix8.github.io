<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestor personal de recursos para partidas de Dungeons & Dragons.">
  <title>Salix8 - D&D Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="dnd-page">
  <div class="bg-glow"></div>

  <div class="dnd-shell">
    <header class="dnd-topbar">
      <a class="back-link dnd-topbar__back" href="../../">← Hub</a>
      <div>
        <p class="dnd-topbar__eyebrow">Dungeons & Dragons</p>
        <h1 class="dnd-topbar__title">Manager D&D</h1>
      </div>
      <div class="dnd-topbar__actions" aria-label="Acciones del gestor">
        <button class="btn btn--outline" type="button" data-action="export">Exportar</button>
        <label class="btn btn--ghost dnd-import">
          Importar
          <input type="file" accept="application/json" data-action="import">
        </label>
      </div>
    </header>

    <main class="dnd-layout">
      <aside class="dnd-sidebar" aria-label="Categorias">
        <section>
          <h2 class="dnd-sidebar__title">Players</h2>
          <nav class="dnd-category-list" data-category-list="players"></nav>
        </section>

        <section>
          <h2 class="dnd-sidebar__title">Dungeon Masters</h2>
          <nav class="dnd-category-list" data-category-list="dm"></nav>
        </section>
      </aside>

      <section class="dnd-browser" aria-label="Navegador de contenido">
        <div class="dnd-browser__toolbar">
          <div class="dnd-search">
            <span aria-hidden="true">⌕</span>
            <input type="search" placeholder="Buscar en el compendio..." data-search>
          </div>

          <select class="dnd-select" data-source-filter aria-label="Filtrar por fuente">
            <option value="all">Todas las fuentes</option>
          </select>
        </div>

        <div class="dnd-browser__content">
          <section class="dnd-list-panel">
            <div class="dnd-list-panel__header">
              <h2 data-active-category>Compendio</h2>
              <span data-result-count>0 resultados</span>
            </div>
            <div class="dnd-entry-list" data-entry-list></div>
          </section>

          <article class="dnd-detail-panel" data-detail-panel>
            <div class="dnd-empty-state">
              <h2>Selecciona un recurso</h2>
              <p>Usa las categorias, busqueda y filtros para revisar contenido. Esta base queda preparada para conectar el futuro constructor de personajes.</p>
            </div>
          </article>
        </div>
      </section>

      <aside class="dnd-manager-panel" aria-label="Personajes guardados">
        <div class="dnd-manager-panel__header">
          <h2>Personajes</h2>
          <button class="btn btn--primary" type="button" data-action="new-character">Nuevo</button>
        </div>

        <form class="dnd-character-form" data-character-form hidden>
          <label>
            Nombre
            <input type="text" name="name" required maxlength="40" placeholder="Nombre del personaje">
          </label>
          <label>
            Clase
            <input type="text" name="className" maxlength="32" placeholder="Guerrero, mago...">
          </label>
          <label>
            Nivel
            <input type="number" name="level" min="1" max="20" value="1">
          </label>
          <div class="dnd-character-form__actions">
            <button class="btn btn--primary" type="submit">Guardar</button>
            <button class="btn btn--ghost" type="button" data-action="cancel-character">Cancelar</button>
          </div>
        </form>

        <div class="dnd-character-list" data-character-list></div>
      </aside>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
