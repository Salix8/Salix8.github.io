<!DOCTYPE html>
<html lang="es">

<head>
	<!--5ETOOLS_CMP-->
	<!--5ETOOLS_ANALYTICS-->
	<!--5ETOOLS_ADCODE-->
	<meta charset="utf-8">
	<meta name="description" content="Tasador de conjuros para Dungeons & Dragons 5e.">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Tasador de conjuros - 5etools</title>

	<link rel="manifest" href="manifest.webmanifest">
	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/jquery-ui.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/spell-pricer.css">
	<link rel="icon" href="favicon.png">

	<script type="text/javascript" src="js/styleswitch.js"></script>
	<script type="text/javascript" src="js/navigation.js"></script>
	<script type="text/javascript" src="js/browsercheck.js"></script>
</head>

<body>
<header class="hidden-xs hidden-sm page__header">
	<div class="container">
		<h1 class="page__title">Tasador de conjuros</h1>
		<p class="page__subtitle">Calcula y guarda el precio de un conjuro.</p>
	</div>
</header>

<nav class="container page__nav" id="navigation"><ul class="nav page__nav-inner" id="navbar"></ul></nav>

<main class="container mt-3 mb-5">
	<div class="spricer__layout">
		<section class="spricer__panel" aria-labelledby="spricer-input-title">
			<h3 id="spricer-input-title" class="mt-0">Datos del conjuro</h3>
			<div class="spricer__spell-picker">
				<div id="spricer-spell-name" class="spricer__spell-name">Ningún conjuro seleccionado</div>
				<button id="spricer-select-spell" type="button" class="btn btn-primary">Elegir conjuro</button>
			</div>

			<div class="spricer__field-grid">
				<div class="spricer__field">
					<label for="spricer-level">Nivel</label>
					<select id="spricer-level" class="form-control"></select>
				</div>
				<div class="spricer__field">
					<label for="spricer-utility">Utilidad</label>
					<select id="spricer-utility" class="form-control">
						<option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
					</select>
				</div>
				<div class="spricer__field">
					<label for="spricer-academy">Academia</label>
					<select id="spricer-academy" class="form-control"><option value="false">No</option><option value="true">Sí</option></select>
				</div>
				<div class="spricer__field">
					<label for="spricer-rarity">Rareza</label>
					<select id="spricer-rarity" class="form-control"><option value="false">No</option><option value="true">Sí</option></select>
				</div>
				<div class="spricer__field">
					<label for="spricer-ritual">Ritual</label>
					<select id="spricer-ritual" class="form-control"><option value="false">No</option><option value="true">Sí</option></select>
				</div>
				<div class="spricer__field">
					<label for="spricer-wizard">Disponible para Wizard</label>
					<select id="spricer-wizard" class="form-control"><option value="true">Sí</option><option value="false">No</option></select>
				</div>
				<div class="spricer__field">
					<label for="spricer-legality">Legalidad</label>
					<select id="spricer-legality" class="form-control">
						<option value="legal">Legal</option><option value="licensed">Bajo licencia</option><option value="illegal">Ilegal</option>
					</select>
				</div>
				<div class="spricer__field">
					<label for="spricer-paid-component">Componente de pago</label>
					<select id="spricer-paid-component" class="form-control"><option value="false">No</option><option value="true">Sí</option></select>
				</div>
			</div>
		</section>

		<section class="spricer__panel" aria-labelledby="spricer-result-title">
			<h3 id="spricer-result-title" class="mt-0">Tasación</h3>
			<div class="spricer__price" id="spricer-price">Selecciona un conjuro</div>
			<div class="spricer__price-meta">
				<span>Precio importado</span><strong id="spricer-imported-price">—</strong>
				<span>Precio local guardado</span><strong id="spricer-local-price">—</strong>
			</div>

			<table class="spricer__breakdown" aria-label="Desglose de la tasación">
				<thead><tr><th>Factor</th><th>Valor</th></tr></thead>
				<tbody id="spricer-breakdown"><tr><td colspan="2">Selecciona un conjuro para calcular su precio.</td></tr></tbody>
			</table>

			<div class="spricer__actions">
				<button id="spricer-save" type="button" class="btn btn-success" disabled>Guardar precio</button>
				<button id="spricer-restore" type="button" class="btn btn-default" disabled>Restaurar precio</button>
				<button id="spricer-reset" type="button" class="btn btn-default" disabled>Restablecer campos</button>
			</div>
			<div id="spricer-save-note" class="spricer__save-note text-muted"></div>
		</section>
	</div>
</main>

<!--5ETOOLS_SCRIPT_ANCHOR-->
<script type="text/javascript" src="lib/jquery.js"></script>
<script type="text/javascript" src="lib/jquery-ui.js"></script>
<script type="text/javascript" src="js/utils.js"></script>
<script type="text/javascript" src="js/utils-ui.js"></script>
<script type="text/javascript" src="lib/localforage.js"></script>
<script type="text/javascript" src="js/omnidexer.js"></script>
<script type="text/javascript" src="js/omnisearch.js"></script>
<script type="text/javascript" src="js/render.js"></script>
<script type="text/javascript" src="js/spell-pricing.js"></script>
<script type="text/javascript" src="js/spell-pricer.js"></script>
<script type="text/javascript" src="js/list2.js"></script>
<script type="text/javascript" src="lib/elasticlunr.js"></script>
</body>
</html>
