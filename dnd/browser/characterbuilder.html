<!DOCTYPE html>
<html lang="en">

<head>
	<!--5ETOOLS_CMP-->
	<!--5ETOOLS_ANALYTICS-->
	<!--5ETOOLS_ADCODE-->
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Character Builder - 5etools</title>

	<link rel="manifest" href="manifest.webmanifest">

	<link rel="stylesheet" href="css/bootstrap.css">
	<link rel="stylesheet" href="css/jquery-ui.css">
	<link rel="stylesheet" href="css/jquery-ui-slider-pips.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/character-builder-traits.css">
	<link rel="icon" href="favicon.png">

	<script type="text/javascript" src="js/styleswitch.js"></script>
	<script type="text/javascript" src="js/navigation.js"></script>
	<script type="text/javascript" src="js/browsercheck.js"></script>

	<style>
		#content_input {
			width: 100%;
			height: 100%;
			padding-right: 3px;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}

		#content_input::-webkit-scrollbar {
			width: 4px;
		}

		#content_input_controls {
			padding: 3px 15px 0;
			border-top: 1px solid #ccc;
		}

		.night-mode #content_input_controls {
			border-color: #555;
		}

		#content_output {
			overflow-y: auto;
			overflow-x: hidden;
		}

		#content_input input[type=number] {
			text-align: right;
		}

		label {
			font-weight: initial;
			max-width: initial;
			margin-bottom: initial;
		}

		textarea.form-control {
			height: 100px;
		}

		.mkbru__wrp-tab-heads--border {
			border-bottom: 1px solid #ccc;
		}

		.night-mode .mkbru__wrp-tab-heads--border {
			border-color: #555;
		}

		.initial-message {
			font-size: 5vmin;
			color: initial;
		}

		.mkbru__cnt-save {
			min-width: 48px;
		}

		.mkbru__sidebar-entry:nth-child(odd) {
			background: #bbbbbb18;
		}

		.mkbru__wrp-output-tab-data {
			box-shadow: none;
			border-left: 1px solid #ccc;
			border-right: 1px solid #ccc;
		}

		.mkbru__row {
			padding: 2px;
			border-radius: 5px;
		}

		.mkbru__wrp-row {
			margin-bottom: 0;
			max-width: initial;
			font-weight: initial;
		}

		.mkbru__row-name {
			min-width: 120px;
			text-align: right;
			font-weight: bold;
		}

		.mkbru__row-name--marked {
			min-width: 114px;
		}

		.mkbru__row-mark {
			width: 1px;
			background: #ccc;
			flex-shrink: 0;
			align-self: stretch;
			margin-top: 4px;
			margin-bottom: 4px;
		}

		.night-mode .mkbru__row-mark {
			background: #555;
		}

		.mkbru__ipt-cb[type=checkbox] {
			margin-top: 0;
			margin-left: 2px;
		}

		.mkbru__ipt-cb--small-offset {
			position: relative;
			top: 2px;
		}

		.mkbru__ipt-cb--plain[type=checkbox] {
			margin-top: 0;
		}

		.mkbru__sub-name--50 {
			min-width: calc(50% - 0.25rem);
			text-align: right;
			font-weight: bold;
		}

		.mkbru__sub-name--33 {
			min-width: calc(33.33333% - 0.25rem);
			text-align: right;
			font-weight: bold;
		}

		.mkbru__wrp-btn-xxs {
			padding-right: 3px;
		}

		.mkbru__wrp-rows {
			border-bottom: 1px solid #cccccc80;
			margin-bottom: 5px;
		}

		.mkbru__wrp-rows--removable:only-child .mkbru__btn-rm-row,
		.mkbru__wrp-rows--removable:only-child .mkbru__btn-up-row,
		.mkbru__wrp-rows--removable:only-child .mkbru__btn-down-row,
		.mkbru__wrp-rows--removable:only-child .mkbru__btn-drag-row,
		.mkbru__wrp-rows--removable-nested-1:only-child .mkbru__btn-rm-row--nested-1 {
			display: none;
		}

		.mkbru__wrp-rows--removable:first-child .mkbru__btn-up-row,
		.mkbru__wrp-rows--removable:last-child .mkbru__btn-down-row {
			display: none;
		}

		tr th.mon__name--token {
			padding: 1px 0.3em;
		}

		.mon__wrp-size-type-align,
		.mon__wrp-avoid-token {
			max-width: none;
		}
	</style>
</head>

<body>
<div class="viewport-wrapper">
	<div class="sidemenu__toggle" style="display: none;">
		<div class="sidemenu__hotzone"></div>
		<div class="sidemenu__burger"></div>
		<div class="sidemenu__burger"></div>
		<div class="sidemenu__burger"></div>
		<div class="sidemenu"></div>
	</div>

	<header class="hidden-xs hidden-sm page__header">
		<div class="container">
			<h1 class="page__title">Character Builder</h1>
			<p class="page__subtitle">Build a character on the left, then review its statblock on the right.</p>
		</div>
	</header>

	<nav class="container page__nav" id="navigation"><ul class="nav page__nav-inner" id="navbar"></ul></nav>

	<div class="cancer__wrp-leaderboard"><!--5ETOOLS_AD_LEADERBOARD--></div>
	<div class="cancer__wrp-sidebar-rhs"><!--5ETOOLS_AD_RIGHT_1--><div class="cancer__sidebar-rhs-inner"><!--5ETOOLS_AD_RIGHT_2--></div></div>

	<div id="page_loading" class="container view-col-wrapper">
		<div class="h-100 w-100 flex-vh-center"><span class="initial-message">Loading...</span></div>
	</div>

	<div id="page_source" class="container view-col-wrapper" style="display: none"></div>

	<div id="page_main" class="container view-col-wrapper" style="display: none">
		<div class="view-col">
			<div id="content_input"></div>
			<div id="content_input_controls" class="text-center"></div>
		</div>

		<div class="view-col" id="content_output"></div>
	</div>
</div>

<!--5ETOOLS_SCRIPT_ANCHOR-->

<script type="text/javascript" src="js/utils-ui.js"></script>

<script type="text/javascript" src="lib/localforage.js"></script>
<script type="text/javascript" src="js/omnidexer.js"></script>
<script type="text/javascript" src="js/omnisearch.js"></script>
<script type="text/javascript" src="js/render.js"></script>
<script type="text/javascript" src="js/render-bestiary.js"></script>
<script type="text/javascript" src="js/render-spells.js"></script>

<script type="text/javascript" src="js/converterutils.js"></script>

	window.BUILDER_PAGE_CONFIG = {
		storageState: "characterBuilderState",
		storageSettings: "characterBuilderSettings",
		activeBuilder: "characterBuilder",
		modes: [
			{key: "characterBuilder", label: "Character"}
		]
	};
</script>
<script type="text/javascript" src="js/makebrew.js"></script>
<script type="text/javascript" src="js/makebrew-character-services.js"></script>

<script type="text/javascript" src="lib/bootstrap-typeahead.js"></script>
</body>
</html>
